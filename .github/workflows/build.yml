name: Build Ubuntu Touch for Pixel 7

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_kernel_only:
        description: 'Build only Linux 5.10 GKI Kernel'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Port Artifacts

    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Maximize Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f || true
          df -h

      - name: Set up Swap Space (16 GB)
        run: |
          echo "==> Configuring swap memory to prevent Kernel / Linker OOM..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h


      - name: Make Scripts Executable
        run: |
          chmod +x scripts/*.sh

      - name: 01 - Setup Build Environment
        run: |
          ./scripts/01_setup_env.sh

      - name: 03 - Apply Kernel Configuration & Patches
        run: |
          ./scripts/03_patch_kernel.sh

      - name: 04 - Compile Linux Kernel & Pack halium-boot.img
        run: |
          ./scripts/04_build_kernel.sh

      - name: 06 - Prepare and Package Ubuntu Touch Rootfs
        run: |
          ./scripts/06_prepare_rootfs.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixel7-ubtouch-images
          path: |
            out/images/rootfs.img
            out/images/boot.img
            out/images/halium-boot.img
            out/images/init_boot.img
            out/images/*.zip
            out/images/*.tar.gz
          if-no-files-found: warn
          retention-days: 14

      - name: Publish Images to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Ubuntu Touch for Pixel 7 (panther) — Latest Preview"
          body: |
            ## 📱 Готовые образы для запуска Ubuntu Touch на Google Pixel 7 (panther)
            
            ### 📦 Содержимое релиза:
            - **`halium-boot.img`** — ядро Linux 5.10 (Header v3) с интерактивным USB-загрузчиком для команды `fastboot boot` (без стирания Android).
            - **`boot.img`** — чистое GKI ядро (Header v4) для постоянной прошивки.
            - **`init_boot.img`** — ramdisk (Header v4) для постоянной прошивки.
            - **`rootfs.img`** — файловая система Ubuntu Touch Focal (20.04 arm64).
            
            ### 🚀 Быстрый запуск (Live-тест в RAM без риска для Android):
            1. Загрузите ядро в оперативку телефона:
               ```bash
               fastboot boot halium-boot.img
               ```
            2. Когда на экране появится `PLEASE, INSERT UBUNTU-FILE.IMG`, запустите на ПК:
               ```powershell
               .\scripts\insert_ubuntu.ps1
               ```
          files: |
            out/images/halium-boot.img
            out/images/boot.img
            out/images/init_boot.img
            out/images/rootfs.img
            out/images/*.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


