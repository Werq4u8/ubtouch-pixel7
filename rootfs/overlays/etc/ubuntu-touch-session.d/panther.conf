# Конфигурация сессии Ubuntu Touch (Lomiri) для Google Pixel 7 (panther)
# Pixel 7: 6.3" AMOLED, 1080 x 2400 (~416 ppi), 90 Hz

GRID_UNIT_PX=18
QT_QPA_PLATFORM=ubuntumirclient
QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu-rasterization"
FORM_FACTOR=phone
NATIVE_ORIENTATION=0
PRIMARY_MONITOR=DSI-1
LOMIRI_MIR_CONFIG=/etc/mir/panther.conf
