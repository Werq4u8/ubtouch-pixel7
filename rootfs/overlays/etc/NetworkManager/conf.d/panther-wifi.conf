#
# NetworkManager configuration optimized for Broadcom BCM4389 (Wi-Fi 6E)
# Device: Google Pixel 7 (panther) - SoC: Google Tensor G2
#

[device-panther-wifi]
# Match internal Broadcom WLAN interface
match-device=interface-name:wlan0,interface-name:p2p0

# Disable aggressive MAC randomization during periodic background scans
# Broadcom BCM4389 firmware can lose roaming state or drop AP handshake with dynamic scan MACs
wifi.scan-rand-mac-address=no

# Power Saving Configuration
# 0 = default, 1 = system default, 2 = disable, 3 = enable
# Disabling 802.11 power save prevents high latency and packet drops on BCM4389 in standby
wifi.powersave=2

[connection-panther]
# Keep connection active during suspend/resume cycles
wifi.cloned-mac-address=preserve

[wifi]
# Use wpa_supplicant backend with nl80211 driver for Halium compatibility
backend=wpa_supplicant

# Enable PMF (Protected Management Frames) for WPA3-SAE & 6 GHz Wi-Fi 6E operations
# 1 = optional, 2 = required
pmf=1
