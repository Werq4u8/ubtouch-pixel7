# ============================================================================
# Конфигурация сборки Ubuntu Touch для Pixel 7
# ============================================================================
# Этот файл определяет ВСЕ переменные для сборки.
# Редактируйте ТОЛЬКО этот файл — скрипты читают его автоматически.
# ============================================================================

# --- Устройство ---
DEVICE_CODENAME="panther"
DEVICE_FAMILY="pantah"
DEVICE_SOC="gs201"
DEVICE_NAME="Google Pixel 7"

# --- Android версия на устройстве ---
# ⚠️ ВАЖНО: должно совпадать с тем что на вашем телефоне!
# У вас Android 16 — поэтому нужны соответствующие исходники
ANDROID_VERSION="16"
ANDROID_API_LEVEL="36"

# --- Ядро ---
# NetHunter ядро на вашем устройстве построено на 5.10
# Мы будем собирать своё ядро на базе тех же исходников
KERNEL_VERSION="5.10"
KERNEL_BRANCH="android-gs-pantah-5.10-android14"
KERNEL_BRANCH_FALLBACK="android-gs-pantah-5.10-android13-qpr3"
KERNEL_MANIFEST_URL="https://android.googlesource.com/kernel/manifest"

# --- LineageOS / AOSP база ---
LINEAGEOS_BRANCH="lineage-20.0"
LINEAGEOS_BRANCH_FALLBACK="lineage-21.0"


# --- Halium ---
# Halium 16 не существует. Мы строим Halium-подобную систему
# на основе последней доступной LineageOS + ваши vendor blobs
HALIUM_APPROACH="custom"  # "standard" или "custom"

# --- Ubuntu Touch rootfs ---
UBTOUCH_RELEASE="focal"   # focal (20.04) или noble (24.04)
UBTOUCH_ARCH="arm64"

# --- Пути ---
WORKDIR="${WORKDIR:-$HOME/ubtouch-pixel7}"
KERNEL_DIR="$WORKDIR/kernel"
HALIUM_DIR="$WORKDIR/halium"
ROOTFS_DIR="$WORKDIR/rootfs"
OUT_DIR="$WORKDIR/out"
BLOB_DIR="$WORKDIR/vendor_blobs"
CCACHE_DIR="$WORKDIR/.ccache"

# --- Сборка ---
BUILD_JOBS="$(nproc)"
USE_CCACHE="1"
CCACHE_SIZE="50G"

# --- Vendor blobs ---
# "extract" = извлечь с устройства (вам нужен этот вариант)
# "themuppets" = скачать из TheMuppets (только для Android 13/14)
VENDOR_BLOB_SOURCE="extract"
